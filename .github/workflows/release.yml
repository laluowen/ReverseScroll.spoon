name: Release

on:
  push:
    tags: ["*"]

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=ReverseScroll.spoon/ -o "ReverseScroll-${VERSION}.zip" HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "$VERSION" --generate-notes
          gh release upload "$VERSION" "ReverseScroll-${VERSION}.zip" --clobber
