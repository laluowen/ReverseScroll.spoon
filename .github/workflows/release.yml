name: Release

on:
  push:
    tags: ["*"]

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p stage/ReverseScroll.spoon
          cp init.lua README.md LICENSE.md stage/ReverseScroll.spoon/
          (cd stage && zip -r "../ReverseScroll-${TAG}.zip" ReverseScroll.spoon)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "ReverseScroll-${TAG}.zip" --clobber
